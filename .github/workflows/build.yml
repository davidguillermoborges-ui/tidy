# Builds the Tidy EXEs on Windows for every push to main and puts the finished app on the "dist" branch.
# HMNS Dev pulls the "dist" branch and installs it to %LOCALAPPDATA%\Programs\Tidy.
name: Build Tidy EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-tidy
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: pyinstaller --noconfirm tidy.spec
      - name: Check the EXE
        shell: pwsh
        run: |
          $out = & dist\Tidy\tidy-server.exe --check
          Write-Host $out
          if ($out -notmatch 'OK') { throw "tidy-server.exe --check failed" }
          python tests/mcp_smoke.py dist\Tidy\tidy-server.exe
      - name: Publish to the dist branch
        shell: pwsh
        run: |
          Copy-Item tidy.json, CHANGES.md dist\Tidy\
          $msg = (git log -1 --format="%h %s")
          Set-Location dist\Tidy
          git init -q -b dist
          git config core.autocrlf false
          git config user.name "Tidy build"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Tidy build from $msg"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
